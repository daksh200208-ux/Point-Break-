<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>POINT BREAK // CYBER SENTINEL DISPLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 100vw; height: 100vh;
  background: #020205;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 20px 16px;
  position: relative;
  touch-action: none;
  user-select: none;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255, 0, 51, 0.12) 0%, transparent 70%);
  pointer-events: none;
}
header {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255, 0, 51, 0.2); padding-bottom: 8px; z-index: 10;
}
.brand { font-family: 'Orbitron'; font-size: 1.1rem; color: #ff0033; font-weight: 900; letter-spacing: 3px; }
.clock { font-family: 'Orbitron'; font-size: 0.95rem; color: #fff; letter-spacing: 1px; }
.stage-container {
  flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 5; cursor: pointer;
}
#companion-canvas {
  width: 300px; height: 300px; display: block;
}
.cd-wrapper {
  position: absolute; width: 220px; height: 220px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 0 35px rgba(255, 0, 51, 0.4), inset 0 0 20px rgba(0,0,0,0.9);
  animation: cdWobble 1.75s ease-in-out infinite;
}
@keyframes cdWobble { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.983); } }
.vinyl-disc {
  width: 100%; height: 100%; border-radius: 50%;
  background:
    repeating-radial-gradient(circle, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 5px),
    radial-gradient(circle, #111 28%, #050505 30%, #1f1f1f 45%, #0a0a0a 60%, #1a1a1a 75%, #000 100%);
  border: 4px solid #333; position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.vinyl-disc::after {
  content: ''; position: absolute; top: -10%; left: -30%;
  width: 55%; height: 55%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, transparent 70%);
  filter: blur(2px);
}
.groove-mark {
  position: absolute; top: 6%; left: 50%; width: 2px; height: 42%;
  background: linear-gradient(to bottom, rgba(255,0,51,0.65), transparent);
  transform-origin: bottom center; transform: translateX(-50%);
}
.groove-mark::before {
  content: ''; position: absolute; top: 0; left: -2px; width: 6px; height: 6px;
  border-radius: 50%; background: #ff0033; box-shadow: 0 0 6px #ff0033;
}
.vinyl-label {
  position: relative; width: 76px; height: 76px; border-radius: 50%;
  background: radial-gradient(circle, #ff0033 55%, #cc0029 100%);
  border: 3px solid #fff; box-shadow: 0 0 15px #ff0033;
  display: flex; align-items: center; justify-content: center;
}
.vinyl-label span { font-family: 'Orbitron'; font-size: 0.55rem; font-weight: 900; color: #fff; letter-spacing: 1px; }
.vinyl-disc .spindle { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #000; border: 2px solid #555; }
.spinning { animation: spinCD 3.5s linear infinite; }
@keyframes spinCD { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
footer {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-top: 1px solid rgba(255, 0, 51, 0.2); padding-top: 8px; z-index: 10;
}
.state-label { font-family: 'Orbitron'; font-size: 0.8rem; color: #ff0033; letter-spacing: 2px; font-weight: 700; transition: color 0.3s ease; }
.sub-label { font-size: 0.85rem; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
.live-pill {
  position: absolute; top: 28px; right: 16px;
  font-family: 'Orbitron'; font-size: 0.52rem;
  color: #00ffaa; background: rgba(0, 255, 170, 0.12);
  border: 1px solid #00ffaa; border-radius: 12px;
  padding: 2px 8px; letter-spacing: 1px;
}
</style>
</head>
<body>
<header>
  <div class="brand">POINT BREAK</div>
  <div class="clock" id="clock">00:00:00</div>
</header>
<div class="live-pill" id="conn-pill">LINKED</div>
<div class="stage-container" onclick="cycleManualMode()" title="Tap to test visual states">
  <canvas id="companion-canvas" width="300" height="300"></canvas>
  <div class="cd-wrapper" id="cd-player">
    <div class="vinyl-disc spinning">
      <div class="groove-mark"></div>
      <div class="vinyl-label"><span id="vinyl-brand-txt">TARS</span></div>
      <div class="spindle"></div>
    </div>
  </div>
</div>
<footer>
  <div class="state-label" id="state-txt">DORMANT</div>
  <div class="sub-label" id="sub-txt">Point Break Neural Core Online</div>
</footer>
<script>
// ── CLOCK ─────────────────────────────────────────────────────────
setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('en-US', {hour12:false});
}, 1000);

// ── CANVAS SETUP ────────────────────────────────────────────────
const canvas = document.getElementById('companion-canvas');
const ctx = canvas.getContext('2d');
const cdPlayer = document.getElementById('cd-player');
const stateTxt = document.getElementById('state-txt');
const subTxt = document.getElementById('sub-txt');
const connPill = document.getElementById('conn-pill');
let currentMode = "sleep"; // sleep | listening | thinking | speaking | music
let angle = 0;
const C = {
  headWhite: '#f7f1de',
  headShade: '#dcd0a8',
  bodyDark: '#3a2716',
  bodyMid: '#5c4025',
  bodyLight: '#7c5732',
  beak: '#ffcf3d',
  beakDark: '#c9860f',
  eye: '#ffe066',
  pupil: '#0a0705',
  talon: '#ffcf3d',
  perch: '#3a2a1a',
  outline: '#120c06'
};

function drawScene() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  angle += 0.045;

  if (currentMode === "music") {
    canvas.style.display = "none";
    cdPlayer.style.display = "flex";
    stateTxt.textContent = "AUDIO PLAYBACK ACTIVE";
    stateTxt.style.color = "#ff0033";
    requestAnimationFrame(drawScene);
    return;
  }

  canvas.style.display = "block";
  cdPlayer.style.display = "none";

  if (currentMode === "thinking") { 
    stateTxt.textContent = "COGNITIVE PROCESSING"; 
    stateTxt.style.color = "#ffaa00"; 
  } else if (currentMode === "speaking") { 
    stateTxt.textContent = "TRANSMITTING VOICE"; 
    stateTxt.style.color = "#ff0033"; 
  } else if (currentMode === "listening") { 
    stateTxt.textContent = "LISTENING"; 
    stateTxt.style.color = "#00e0ff"; 
  } else { 
    stateTxt.textContent = "DORMANT"; 
    stateTxt.style.color = "#ff0033"; 
  }

  const bob = currentMode === "sleep" ? Math.sin(angle * 0.6) * 2 : Math.sin(angle * 1.3) * 2;
  const baseY = cy + 8 + bob;

  if (currentMode === "listening") {
    drawSoundWaves(cx, baseY - 20);
    drawRadar(cx + 76, baseY - 100);
  }
  if (currentMode === "thinking" && angle - ruffleStart > 2.6) ruffleStart = angle;

  drawPerch(cx, baseY + 118);
  drawTalons(cx, baseY + 105);
  drawWings(cx, baseY + 40, currentMode, angle);
  drawBody(cx, baseY + 55);
  drawHead(cx, baseY - 35, currentMode, angle);

  if (currentMode === "sleep") drawZzz(cx + 62, baseY - 90);
  if (currentMode === "thinking") drawThoughtCloud(cx + 58, baseY - 105);

  requestAnimationFrame(drawScene);
}

function drawPerch(cx, y) {
  ctx.strokeStyle = C.perch;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 70, y);
  ctx.lineTo(cx + 70, y);
  ctx.stroke();
  ctx.strokeStyle = '#241a10';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - 70, y - 3);
  ctx.lineTo(cx + 70, y - 3);
  ctx.stroke();
}

function drawTalons(cx, y) {
  [-24, 24].forEach(dx => {
    const x = cx + dx;
    ctx.fillStyle = C.talon;
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y, 9, 7, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    for (let t = -1; t <= 1; t++) {
      ctx.beginPath();
      ctx.moveTo(x + t * 6, y + 4);
      ctx.quadraticCurveTo(x + t * 8, y + 14, x + t * 5, y + 18);
      ctx.lineWidth = 3;
      ctx.strokeStyle = C.talon;
      ctx.stroke();
    }
  });
}

let ruffleStart = -999;
function drawWings(cx, cy, mode, angle) {
  const baseFlutter = (mode === "listening") ? Math.sin(angle * 5) * 0.05 : Math.sin(angle * 0.9) * 0.02;
  [-1, 1].forEach(side => {
    let ripple = 0;
    if (mode === "thinking") {
      const t = angle - ruffleStart - (side === 1 ? 0.07 : 0);
      if (t >= 0 && t < 2.2) ripple = Math.sin(t * 14) * 0.14 * Math.exp(-t * 1.6);
    }
    const flutter = baseFlutter + ripple;
    ctx.save();
    ctx.translate(cx + side * 48, cy);
    ctx.rotate(side * (0.18 + flutter));
    ctx.beginPath();
    ctx.moveTo(0, -40);
    ctx.quadraticCurveTo(side * 34, -20, side * 40, 30);
    ctx.quadraticCurveTo(side * 30, 55, 0, 60);
    ctx.quadraticCurveTo(side * -6, 15, 0, -40);
    ctx.closePath();
    ctx.fillStyle = C.bodyDark;
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.bodyLight;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(side * (6 + i * 6), -30 + i * 4);
      ctx.quadraticCurveTo(side * (20 + i * 5), 0 + i * 8, side * (18 + i * 4), 40 + i * 4);
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawBody(cx, cy) {
  ctx.beginPath();
  ctx.moveTo(cx - 46, cy - 30);
  ctx.quadraticCurveTo(cx - 55, cy + 30, cx - 20, cy + 68);
  ctx.quadraticCurveTo(cx, cy + 80, cx + 20, cy + 68);
  ctx.quadraticCurveTo(cx + 55, cy + 30, cx + 46, cy - 30);
  ctx.quadraticCurveTo(cx, cy - 50, cx - 46, cy - 30);
  ctx.closePath();
  ctx.fillStyle = C.bodyMid;
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 2.5;
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(124, 87, 50, 0.7)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const yy = cy - 10 + i * 14;
    ctx.beginPath();
    ctx.moveTo(cx - 26 + (i % 2) * 4, yy);
    ctx.quadraticCurveTo(cx, yy + 8, cx + 26 - (i % 2) * 4, yy);
    ctx.stroke();
  }
}

let headTiltCurrent = 0, headTiltTarget = 0, nextTiltChange = 0;
function drawHead(cx, cy, mode, angle) {
  let settleTarget = 0;
  if (mode === "thinking") settleTarget = 0.09;
  else if (mode === "sleep") settleTarget = 0.07;
  if (mode === "listening") {
    if (angle > nextTiltChange) {
      headTiltTarget = (Math.random() - 0.5) * 0.32;
      nextTiltChange = angle + 1.3 + Math.random() * 1.2;
    }
    headTiltCurrent += (headTiltTarget - headTiltCurrent) * 0.32;
  } else {
    headTiltTarget = settleTarget;
    headTiltCurrent += (headTiltTarget - headTiltCurrent) * 0.06;
  }
  const rot = headTiltCurrent;
  ctx.save();
  ctx.translate(cx, cy + 45);
  ctx.rotate(rot);
  ctx.translate(-cx, -(cy + 45));
  ctx.beginPath();
  ctx.moveTo(cx - 18, cy + 20);
  ctx.quadraticCurveTo(cx, cy + 34, cx + 18, cy + 20);
  ctx.lineTo(cx + 22, cy + 45);
  ctx.lineTo(cx - 22, cy + 45);
  ctx.closePath();
  ctx.fillStyle = C.headWhite;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx, cy, 42, 38, 0, 0, Math.PI * 2);
  ctx.fillStyle = C.headWhite;
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 2.5;
  ctx.fill(); ctx.stroke();

  const crestLift = (mode === "listening") ? 14 : (mode === "thinking" ? 6 : 2);
  ctx.strokeStyle = C.headShade;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  [-14, -4, 6, 16].forEach((dx, i) => {
    ctx.beginPath();
    ctx.moveTo(cx + dx, cy - 34);
    ctx.lineTo(cx + dx * 0.8, cy - 34 - crestLift - i);
    ctx.stroke();
  });

  ctx.strokeStyle = C.headShade;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 30, cy - 6);
  ctx.quadraticCurveTo(cx - 16, cy - 16, cx - 4, cy - 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 30, cy - 6);
  ctx.quadraticCurveTo(cx + 16, cy - 16, cx + 4, cy - 8);
  ctx.stroke();
  drawEyes(cx, cy, mode);
  drawBeak(cx, cy, mode);
  ctx.restore();
}

let eyeDart = { x: 0, y: 0 }, eyeDartTarget = { x: 0, y: 0 }, nextDartChange = 0;
const SCAN_PRESETS = [[-3,-2],[3,-2],[0,3],[-2,3],[2,-3],[0,0]];
function drawEyes(cx, cy, mode) {
  if (mode === "listening") {
    if (angle > nextDartChange) {
      const a = Math.random() * Math.PI * 2;
      const r = 4 + Math.random() * 3;
      eyeDartTarget = { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.55 };
      nextDartChange = angle + 0.6 + Math.random() * 0.8;
    }
    eyeDart.x += (eyeDartTarget.x - eyeDart.x) * 0.4;
    eyeDart.y += (eyeDartTarget.y - eyeDart.y) * 0.4;
  } else if (mode === "thinking") {
    if (angle > nextDartChange) {
      const p = SCAN_PRESETS[Math.floor(Math.random() * SCAN_PRESETS.length)];
      eyeDartTarget = { x: p[0], y: p[1] };
      nextDartChange = angle + 0.16 + Math.random() * 0.18;
    }
    eyeDart.x += (eyeDartTarget.x - eyeDart.x) * 0.6;
    eyeDart.y += (eyeDartTarget.y - eyeDart.y) * 0.6;
  } else {
    eyeDart.x += (0 - eyeDart.x) * 0.2;
    eyeDart.y += (0 - eyeDart.y) * 0.2;
  }
  const xL = cx - 16 + eyeDart.x, xR = cx + 16 + eyeDart.x, yE = cy - 2 + eyeDart.y;
  const blinkWindow = (angle * 10) % 260;
  const blinking = mode !== "sleep" && blinkWindow < 5;
  if (mode === "sleep" || blinking) {
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    [xL, xR].forEach(x => {
      ctx.beginPath();
      ctx.moveTo(x - 8, yE);
      ctx.quadraticCurveTo(x, yE + 3, x + 8, yE);
      ctx.stroke();
    });
    return;
  }
  let glow = "#ff0033";
  let r = 8;
  if (mode === "listening") { glow = "#00e0ff"; r = 9.5; }
  else if (mode === "thinking") { glow = "#ffaa00"; }
  else if (mode === "speaking") { r = 8 + Math.abs(Math.sin(angle * 6)) * 1.5; }
  [xL, xR].forEach(x => {
    ctx.beginPath();
    ctx.arc(x, yE, r, 0, Math.PI * 2);
    ctx.fillStyle = C.eye;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, yE, r * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = C.pupil;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, yE, r + 3.5, 0, Math.PI * 2);
    ctx.strokeStyle = glow;
    ctx.shadowColor = glow;
    ctx.shadowBlur = 10;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.shadowBlur = 0;
  });
}

function drawBeak(cx, cy, mode) {
  const bx = cx, topY = cy + 16;
  ctx.beginPath();
  ctx.moveTo(bx - 11, topY - 4);
  ctx.quadraticCurveTo(bx - 14, topY + 10, bx - 3, topY + 22);
  ctx.quadraticCurveTo(bx + 5, topY + 26, bx + 10, topY + 17);
  ctx.quadraticCurveTo(bx + 12, topY + 6, bx + 11, topY - 4);
  ctx.closePath();
  const grad = ctx.createLinearGradient(bx, topY - 4, bx, topY + 26);
  grad.addColorStop(0, C.beak);
  grad.addColorStop(1, C.beakDark);
  ctx.fillStyle = grad;
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.arc(bx - 5, topY + 2, 1.6, 0, Math.PI * 2);
  ctx.fillStyle = C.outline;
  ctx.fill();

  let openAmt = 0;
  if (mode === "speaking") {
    speakTimer--;
    if (speakTimer <= 0) {
      if (speakPhase === "closed") {
        speakPhase = "open";
        speakTimer = 5 + Math.floor(Math.random() * 7);
        speakOpenTarget = 0.55 + Math.random() * 0.45;
      } else {
        speakPhase = "closed";
        const sentenceBreak = Math.random() < 0.18;
        speakTimer = sentenceBreak ? (16 + Math.floor(Math.random() * 10)) : (4 + Math.floor(Math.random() * 6));
        speakOpenTarget = 0;
      }
    }
    const easeSpeed = speakPhase === "open" ? 0.55 : 0.8;
    speakCurrentOpen += (speakOpenTarget - speakCurrentOpen) * easeSpeed;
    openAmt = speakCurrentOpen;
  } else {
    speakPhase = "closed"; speakTimer = 0; speakCurrentOpen = 0;
  }
  ctx.save();
  ctx.translate(bx, topY + 10);
  ctx.rotate(openAmt * 0.6);
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.quadraticCurveTo(-7, 10, 0, 13);
  ctx.quadraticCurveTo(7, 10, 8, 0);
  ctx.closePath();
  ctx.fillStyle = C.beakDark;
  ctx.strokeStyle = C.outline;
  ctx.lineWidth = 1.5;
  ctx.fill(); ctx.stroke();
  ctx.restore();
  if (mode === "speaking") drawEqualizer(cx, topY + 32, speakCurrentOpen);
}

let speakPhase = "closed", speakTimer = 0, speakOpenTarget = 0, speakCurrentOpen = 0;
function drawEqualizer(cx, y, level) {
  const bars = 5;
  for (let i = 0; i < bars; i++) {
    const freq = 2 + i * 0.7;
    const noise = (Math.sin(angle * freq + i * 1.7) + 1) / 2;
    const h = 3 + (level * 0.7 + noise * 0.3) * 13;
    const x = cx - ((bars - 1) * 5) / 2 + i * 5;
    ctx.fillStyle = `rgba(255, 0, 51, ${0.45 + level * 0.5})`;
    ctx.shadowColor = "#ff0033";
    ctx.shadowBlur = 5;
    ctx.fillRect(x - 1.5, y - h / 2, 3, h);
    ctx.shadowBlur = 0;
  }
}

function drawSoundWaves(cx, cy) {
  for (let i = 0; i < 3; i++) {
    const phase = (angle * 40 + i * 30) % 100;
    const radius = 60 + phase;
    const alpha = Math.max(0, 1 - phase / 100);
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0, 224, 255, ${alpha * 0.5})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawThoughtCloud(cx, cy) {
  const bob = Math.sin(angle * 1.2) * 2;
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  const parts = [[0,0,11],[13,-4,8],[-13,-3,8],[5,-10,7],[-6,-9,6]];
  parts.forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(cx+dx, cy+dy+bob, r, 0, Math.PI*2); ctx.fill(); });
  ctx.strokeStyle = C.outline; ctx.lineWidth = 1.2;
  parts.forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(cx+dx, cy+dy+bob, r, 0, Math.PI*2); ctx.stroke(); });
  ctx.beginPath(); ctx.arc(cx-22, cy+16+bob, 3.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx-28, cy+24+bob, 2, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  if (angle > pulseNext) {
    pulseEdge = Math.floor(Math.random() * NET_EDGES.length);
    pulseProgress = 0;
    pulseNext = angle + 0.32 + Math.random() * 0.22;
  }
  pulseProgress = Math.min(1, pulseProgress + 0.09);
  ctx.strokeStyle = "rgba(255,255,255,0.32)";
  ctx.lineWidth = 1;
  NET_EDGES.forEach(([a, b]) => {
    ctx.beginPath();
    ctx.moveTo(cx + NET_NODES[a][0], cy + NET_NODES[a][1] + bob);
    ctx.lineTo(cx + NET_NODES[b][0], cy + NET_NODES[b][1] + bob);
    ctx.stroke();
  });
  const [ea, eb] = NET_EDGES[pulseEdge];
  const ax = cx + NET_NODES[ea][0], ay = cy + NET_NODES[ea][1] + bob;
  const bxp = cx + NET_NODES[eb][0], byp = cy + NET_NODES[eb][1] + bob;
  ctx.strokeStyle = "rgba(255,0,51,0.85)";
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bxp, byp); ctx.stroke();
  const px = ax + (bxp - ax) * pulseProgress;
  const py = ay + (byp - ay) * pulseProgress;
  ctx.beginPath();
  ctx.arc(px, py, 2.6, 0, Math.PI * 2);
  ctx.fillStyle = "#ff5533";
  ctx.shadowColor = "#ff0033"; ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;
  NET_NODES.forEach(([nx, ny], i) => {
    const lit = i === ea || i === eb;
    ctx.beginPath();
    ctx.arc(cx + nx, cy + ny + bob, lit ? 2.6 : 1.8, 0, Math.PI * 2);
    ctx.fillStyle = lit ? "#ffffff" : "rgba(255,255,255,0.5)";
    ctx.fill();
  });
}
const NET_NODES = [[-9,-4],[7,-7],[11,3],[-2,8],[-11,2],[3,-1]];
const NET_EDGES = [[0,1],[1,2],[2,3],[3,4],[4,0],[0,5],[5,2],[5,3],[1,5]];
let pulseEdge = 0, pulseProgress = 1, pulseNext = 0;

function drawRadar(cx, cy) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(0,224,255,0.35)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 9.5, 0, Math.PI * 2); ctx.stroke();
  ctx.translate(cx, cy);
  ctx.rotate(angle * 4);
  const grad = ctx.createLinearGradient(0, 0, 16, 0);
  grad.addColorStop(0, "rgba(0,224,255,0.9)");
  grad.addColorStop(1, "rgba(0,224,255,0)");
  ctx.strokeStyle = grad; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 0); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = "#00e0ff"; ctx.fill();
}

function drawZzz(x, y) {
  for (let i = 0; i < 3; i++) {
    const t = (angle * 20 + i * 40) % 120;
    const yy = y - t * 0.6;
    const alpha = Math.max(0, 1 - t / 120);
    const size = 10 + i * 4;
    ctx.font = `bold ${size}px Orbitron, sans-serif`;
    ctx.fillStyle = `rgba(255, 0, 51, ${alpha})`;
    ctx.fillText("Z", x + i * 6, yy);
  }
}

// ── MANUAL STATE CYCLE FOR TESTING ────────────────────────────────
const modes = ["sleep", "listening", "thinking", "speaking", "music"];
let manualIndex = 0;
function cycleManualMode() {
  manualIndex = (manualIndex + 1) % modes.length;
  currentMode = modes[manualIndex];
  if (currentMode === "music") subTxt.textContent = "AC/DC - Back In Black";
  else if (currentMode === "speaking") subTxt.textContent = "Vocal Matrix Transmitting Speech...";
  else if (currentMode === "thinking") subTxt.textContent = "Calculating Optimal Directives...";
  else if (currentMode === "listening") subTxt.textContent = "Awaiting Audio Input...";
  else subTxt.textContent = "Point Break Neural Core";
}

requestAnimationFrame(drawScene);

// ── MULTI-ENDPOINT LIVE TELEMETRY POLLING ─────────────────────────
const endpoints = ['/api/status', '/status', '/jarvis_status.json'];
let epIndex = 0;

async function pollTars() {
  try {
    const ep = endpoints[epIndex];
    const res = await fetch(ep, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    
    connPill.textContent = "LINKED";
    connPill.style.color = "#00ffaa";
    connPill.style.borderColor = "#00ffaa";

    if (d.media_playing) {
      currentMode = "music";
      subTxt.textContent = d.media_title || "Playing Audio Track";
    } else if (d.status === "listening") {
      currentMode = "listening";
      subTxt.textContent = "Awaiting Input...";
    } else if (d.status === "processing" || d.status === "working" || d.status === "scanning") {
      currentMode = "thinking";
      subTxt.textContent = "Synthesizing Directives...";
    } else if (d.status === "speaking") {
      currentMode = "speaking";
      subTxt.textContent = d.jarvis_says || "Vocal Matrix Active";
    } else {
      currentMode = "sleep";
      subTxt.textContent = "Point Break Core Online";
    }
  } catch (e) {
    epIndex = (epIndex + 1) % endpoints.length;
    connPill.textContent = "CONNECTING...";
    connPill.style.color = "#ffaa00";
    connPill.style.borderColor = "#ffaa00";
  }
  setTimeout(pollTars, 400);
}
pollTars();
</script>
