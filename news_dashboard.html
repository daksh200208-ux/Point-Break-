<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. — Global Intelligence Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020b18;
      color: #a8d8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated starfield background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(0,100,180,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(0,200,255,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 36px;
      border-bottom: 1px solid rgba(0,200,255,0.15);
      background: rgba(0,15,35,0.9);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0,212,255,0.5);
    }

    .logo span { color: #fff; opacity: 0.5; font-weight: 400; font-size: 0.75rem; display: block; letter-spacing: 6px; }

    #clock {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      color: #00d4ff;
      letter-spacing: 2px;
    }

    .status-dot {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.75rem; letter-spacing: 2px; color: #00ff88; text-transform: uppercase;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,136,0.4);} 50%{opacity:0.6;box-shadow:0 0 0 6px rgba(0,255,136,0);} }

    .main-grid {
      position: relative; z-index: 5;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      padding: 20px 36px;
      height: calc(100vh - 80px);
    }

    /* MAP SECTION */
    .map-panel {
      background: rgba(0,20,50,0.6);
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(8px);
    }

    .map-panel iframe {
      width: 100%; height: 100%; border: none; filter: saturate(0.7) hue-rotate(180deg) brightness(0.8);
    }

    .map-overlay {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 14px 18px;
      background: linear-gradient(to bottom, rgba(2,11,24,0.95) 0%, transparent 100%);
      display: flex; align-items: center; gap: 10px;
    }

    .map-overlay h3 {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem; letter-spacing: 3px; color: #00d4ff; text-transform: uppercase;
    }

    /* SCANNING LINE */
    .scan-line {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      animation: scan 4s linear infinite;
      opacity: 0.6;
    }
    @keyframes scan { from{top:0} to{top:100%} }

    /* NEWS PANEL */
    .news-panel {
      display: flex; flex-direction: column; gap: 14px;
      overflow: hidden;
    }

    .news-panel h2 {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem; letter-spacing: 4px; color: #00d4ff; text-transform: uppercase;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0,200,255,0.2);
    }

    .news-list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      padding-right: 4px;
    }

    .news-list::-webkit-scrollbar { width: 3px; }
    .news-list::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 2px; }

    .news-card {
      background: rgba(0,30,60,0.7);
      border: 1px solid rgba(0,200,255,0.12);
      border-left: 3px solid rgba(0,200,255,0.4);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: default;
      transition: all 0.3s ease;
      animation: fadeSlide 0.5s ease both;
      position: relative;
      overflow: hidden;
    }

    .news-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .news-card.active {
      border-left-color: #00d4ff;
      background: rgba(0,60,120,0.5);
      box-shadow: 0 0 20px rgba(0,212,255,0.15), inset 0 0 20px rgba(0,212,255,0.05);
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .news-number {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem; color: #00d4ff; letter-spacing: 2px;
      margin-bottom: 5px; display: block;
    }

    .news-title {
      font-size: 0.88rem; line-height: 1.4; color: #cce8ff;
      font-weight: 600;
    }

    .news-source {
      font-size: 0.7rem; color: rgba(168,216,240,0.5);
      margin-top: 6px; letter-spacing: 1px;
    }

    /* JARVIS speaking indicator */
    .speaking-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: rgba(0,212,255,0.05);
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 8px;
    }

    .speaking-bar p { font-size: 0.8rem; color: #00d4ff; letter-spacing: 1px; }

    .wave-bars { display: flex; gap: 3px; align-items: center; }
    .wave-bar {
      width: 3px; background: #00d4ff; border-radius: 2px;
      animation: wave 1s ease-in-out infinite;
    }
    .wave-bar:nth-child(1){height:8px;animation-delay:0s}
    .wave-bar:nth-child(2){height:16px;animation-delay:0.15s}
    .wave-bar:nth-child(3){height:22px;animation-delay:0.3s}
    .wave-bar:nth-child(4){height:16px;animation-delay:0.45s}
    .wave-bar:nth-child(5){height:8px;animation-delay:0.6s}

    @keyframes wave { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

    /* Jarvis says box */
    #jarvis-says {
      padding: 10px 14px;
      background: rgba(0,100,50,0.1);
      border: 1px solid rgba(0,255,136,0.15);
      border-radius: 8px;
      font-size: 0.82rem;
      color: rgba(200,255,220,0.8);
      line-height: 1.5;
      min-height: 50px;
      font-style: italic;
    }

    #jarvis-says span {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem; letter-spacing: 2px; color: #00ff88;
      display: block; margin-bottom: 4px; font-style: normal;
    }

    /* Corner decorations */
    .corner-tl, .corner-br {
      position: absolute; width: 20px; height: 20px;
      border-color: rgba(0,212,255,0.5); border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .loading-msg {
      display: flex; align-items: center; gap: 10px;
      padding: 20px; color: rgba(168,216,240,0.5); font-size: 0.85rem;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,212,255,0.2);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<header>
  <div class="logo">J.A.R.V.I.S. <span>GLOBAL INTEL FEED</span></div>
  <div class="status-dot"><div class="dot"></div> LIVE</div>
  <div id="clock">--:-- --</div>
</header>

<div class="main-grid">
  <!-- World Map -->
  <div class="map-panel">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="scan-line"></div>
    <div class="map-overlay">
      <h3>📡 Live Intelligence Map</h3>
    </div>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m2!1m1!1s0!2m2!1d0!2d0!3m2!1i800!2i600!4f0!5m1!1e4"
      allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"
      title="World Map">
    </iframe>
  </div>

  <!-- News Panel -->
  <div class="news-panel">
    <h2>📰 Top Headlines</h2>

    <div class="news-list" id="news-list">
      <div class="loading-msg"><div class="spinner"></div> Connecting to global feed...</div>
    </div>

    <!-- Jarvis Speaking -->
    <div class="speaking-bar">
      <div class="wave-bars">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <p>JARVIS ACTIVE</p>
    </div>

    <!-- What Jarvis is currently saying -->
    <div id="jarvis-says">
      <span>JARVIS SAYS</span>
      Pulling up the latest global intelligence feed for you...
    </div>
  </div>
</div>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('clock').textContent =
      `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ampm}`;
  }
  setInterval(updateClock, 1000); updateClock();

  // News feed via public API proxy
  async function loadNews() {
    const list = document.getElementById('news-list');
    try {
      // Use RSS2JSON API (free, no key needed for limited use)
      const rss = encodeURIComponent('https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en');
      const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rss}&count=10`);
      const data = await response.json();

      if (!data.items || !data.items.length) throw new Error('No items');

      list.innerHTML = '';
      data.items.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.style.animationDelay = `${i * 0.08}s`;
        card.id = `card-${i}`;

        const source = item.author || item.categories?.[0] || 'Global Feed';
        card.innerHTML = `
          <span class="news-number">// ITEM ${String(i+1).padStart(2,'0')}</span>
          <div class="news-title">${item.title}</div>
          <div class="news-source">${source}</div>
        `;
        list.appendChild(card);
      });

      // Highlight each card in sequence (syncing with Jarvis speaking)
      highlightCards(data.items.length);

    } catch (e) {
      list.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Securing connection...</div>';
      // Retry after 3s
      setTimeout(loadNews, 3000);
    }
  }

  function highlightCards(count) {
    let i = 0;
    function next() {
      // Remove active from previous
      document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
      if (i < count) {
        const card = document.getElementById(`card-${i}`);
        if (card) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        i++;
        setTimeout(next, 6000); // Highlight each card for 6 seconds
      } else {
        i = 0;
        setTimeout(next, 500);
      }
    }
    next();
  }

  // Listen for messages from Python (via local file update)
  function pollJarvisSays() {
    fetch('jarvis_current.txt?t=' + Date.now())
      .then(r => r.text())
      .then(txt => {
        const div = document.getElementById('jarvis-says');
        div.innerHTML = `<span>JARVIS SAYS</span>${txt.trim()}`;
      })
      .catch(() => {});
    setTimeout(pollJarvisSays, 1500);
  }

  loadNews();
  setTimeout(() => pollJarvisSays(), 2000);
</script>
</body>
</html>
